<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <article class="card">
      <figure class="card__media">
        <img src="./assets/images/illustration-article.svg" alt="Article illustration" class="card__image">
      </figure>
      <div class="card__body">
        <p class="card__eyebrow">Article</p>
        <h1 class="card__title">The Bright Future of Web 3.0?</h1>
        <p class="card__text">We dive into the next evolution of the web that claims to put the power of the platforms back into the hands of the people. But is it really fulfilling its promise?</p>
        <div class="card__footer">
          <img src="./assets/images/image-avatar.webp" alt="Author avatar" class="author__avatar">
          <div class="author__info">
            <p class="author__name">Josh Jones</p>
            <p class="author__date">28 Jun 2020</p>
          </div>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
