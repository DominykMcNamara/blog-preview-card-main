<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <article class="card">
      <div class="card__image">
        <img src="./assets/images/illustration-article.svg" alt="Article illustration" class="card__illustration">
      </div>
      <div class="card__content">
        <div class="card__category">Learning</div>
        <p class="card__published">May 6, 2026</p>
        <h1 class="card__title">HTML & CSS foundations</h1>
        <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="card__author">
        <img src="./assets/images/image-avatar.webp" alt="Greg Hooper avatar" class="card__avatar">
        <p class="card__author-name">Greg Hooper</p>
      </div>
    </article>
  </main>
</body>

</html>
